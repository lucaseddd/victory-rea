# Copy to harness.toml (ignored by Git) and adjust the paths for your machine.
# Use single quotes: in TOML they do not treat the backslash as an escape.

# Pipeline work folder, OUTSIDE the repository. The scripts create and use:
#   versions\       built versions (vNNN-<name>-<sha8>\ with exe, pdb, D3D12\, manifest.json)
#   runtime\        the fixed path every version runs from (one firewall rule for all)
#   seed-data\      the starting save, restored into data\ before every run (you provide it)
#   data\           the runtime's data folder during a run
#   cache\          shared shader/pipeline cache
#   runs\           per-run logs, settings, milestones, samples, score and comparison
#   scoreboard.csv, scoreboard.md
work_dir = 'D:\victory\pipeline'

# The title's executable, from your own console's dump. It never goes into the repository.
title_exe = 'D:\dump\title\game.exe'

# Agility SDK binaries (folder with D3D12Core.dll and d3d12SDKLayers.dll), version 1.620.2.
agility_bin = 'D:\victory\d3d12-agility-1.620.2\build\native\bin\x64'

# Optional: vcvars64.bat to load the MSVC environment before cargo. Leave empty if your shell already has it.
vcvars = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat'

# Rust toolchain passed to cargo as +<toolchain>.
rust_toolchain = '1.98.1'
