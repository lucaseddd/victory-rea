# Copy to harness.toml (ignored by Git) and adjust the paths for your machine.
# Use single quotes: in TOML they do not treat the backslash as an escape.

# victory.exe built with the patches in harness/patches (build with --features diagnostics).
runtime_exe = 'D:\victory\cand\victory.exe'

# Optional: expected SHA-256 of the runtime. If set, the launcher refuses any other binary.
runtime_sha256 = ''

# The title's executable, from your own console's dump. It never goes into the repository.
title_exe = 'D:\dump\title\game.exe'

# Run folder, OUTSIDE the repository: logs, cache, data, data-semente.
run_dir = 'D:\victory\runs'
