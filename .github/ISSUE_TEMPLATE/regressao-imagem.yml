name: Image regression
description: An image difference between a candidate and the local reference. Numbers only, no images.
title: "Regression: "
labels: ["image-regression", "status:open"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach screenshots or videos. Describe what you see in words and give the metric from the local comparison.
  - type: input
    id: build
    attributes:
      label: Build and hash (with the regression)
      placeholder: "victory.exe sha256 …"
    validations:
      required: true
  - type: input
    id: referencia
    attributes:
      label: Reference build and hash
      placeholder: "victory.exe sha256 84996d18…f563e"
    validations:
      required: true
  - type: input
    id: cena
    attributes:
      label: Scene and checkpoint
      placeholder: "C1 cutscene, checkpoint 3"
    validations:
      required: true
  - type: input
    id: perfil
    attributes:
      label: Effective profile
      placeholder: "Controle · VICTORY_TEXTURE_AUTO_VRAM=1 · warm cache"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: What you see (in words)
      placeholder: "The 3D scene is fully black; HUD and subtitles show."
    validations:
      required: true
  - type: textarea
    id: metricas
    attributes:
      label: Comparison metrics
      value: |
        | Metric | Candidate | Reference | Tag |
        |---|---|---|---|
        | Similarity to the reference (e.g. SSIM) | | | |
        | % black pixels | | | |
        | FPS / median ms | | | |
    validations:
      required: true
  - type: checkboxes
    id: regras
    attributes:
      label: Checks
      options:
        - label: Every number is tagged [obs-local], [relatado] (reported) or [estimado] (estimated)
          required: true
        - label: No image, video, capture or asset is attached
          required: true
