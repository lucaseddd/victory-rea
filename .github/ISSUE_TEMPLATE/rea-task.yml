name: REA task
description: One long-running REA workstream. The claim label identifies its holder.
title: "[R??] "
labels: ["task", "status:open"]
body:
  - type: markdown
    attributes:
      value: |
        One Issue per task. Before filling this in, read CONTRIBUTING.md and DATA-POLICY.md.
        Nothing from the game goes here: only the build's hash/GUID, function offsets and aggregate numbers.
  - type: input
    id: task
    attributes:
      label: Task ID
      placeholder: R07
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area (also apply the matching label)
      options:
        - readback
        - vram-mips
        - directstorage
        - present
        - shaders
        - image-regression
        - geometry
        - animation
        - coordination
        - submission
        - instrumentation
        - baseline
        - gpu-exec
        - textures
        - threads-sync
        - optimization
        - validation
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0", "P1", "P2"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and definition of done
      description: What the task delivers and how to tell it is finished.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build and hash
      description: Executable and SHA-256 (or BLAKE3); PDB GUID/age if available.
      placeholder: "victory.exe sha256 d29834ae…378d772 · PDB GUID {…} age 1"
    validations:
      required: true
  - type: input
    id: scene
    attributes:
      label: Scene and checkpoints
      placeholder: "C1 cutscene, M1 first mission · or: static analysis"
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Effective profile
      description: Profile, VICTORY_* variables that differ, resolution, scale, cold/warm cache.
      placeholder: "Control · VICTORY_QUEUE2=0 · 1080p · cold cache"
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Current metrics
      description: Rendered FPS, median, p95, % > 33.33 ms, hitches, VRAM, score. Write "unavailable" when there is no measurement.
      value: |
        | Metric | Value | Tag |
        |---|---|---|
        | Rendered FPS | unavailable | |
        | Median ms / p95 ms | unavailable | |
        | % > 33.33 ms | unavailable | |
        | Typical / peak VRAM MB | unavailable | |
        | Harness score | unavailable | |
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "R03 (protocol) + GPU lock"
  - type: textarea
    id: status
    attributes:
      label: Status (kept up to date by the holder)
      value: |
        - State: open
        - Progress: 0%
        - Blocker:
        - Next step:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Every number is tagged [observed], [reported] or [estimated]
          required: true
        - label: This Issue contains no asset, binary, raw log, capture, disassembly of the title or personal data
          required: true
